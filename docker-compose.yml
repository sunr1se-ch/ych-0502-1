version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reeling
      POSTGRES_PASSWORD: reeling123
      POSTGRES_DB: reeling_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
